[project]
name = "news-flow"
version = "0.1.0"
description = "Self-hosted news aggregation and curation tool"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
