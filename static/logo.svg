<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="News Flow logo">
  <defs>
    <linearGradient id="nfGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="nfCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="nfShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded app-style background -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#nfGrad)"/>

  <!-- Stacked news cards -->
  <g filter="url(#nfShadow)">
    <!-- back card -->
    <rect x="38" y="18" width="34" height="46" rx="5" fill="#C7D2FE" opacity="0.55"/>
    <!-- middle card -->
    <rect x="32" y="22" width="34" height="46" rx="5" fill="#A5B4FC" opacity="0.8"/>
    <!-- front card -->
    <rect x="24" y="26" width="34" height="46" rx="5" fill="#ffffff"/>
    <rect x="24" y="26" width="34" height="46" rx="5" fill="url(#nfCardGrad)"/>
  </g>

  <!-- Headline + text lines on front card -->
  <rect x="29" y="32" width="18" height="4" rx="2" fill="#4F46E5"/>
  <rect x="29" y="41" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>
  <rect x="29" y="47" width="20" height="2.5" rx="1.25" fill="#A5B4FC"/>
  <rect x="29" y="53" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>

  <!-- Flow arrow sweeping across the cards -->
  <path d="M46 62 C56 70, 66 66, 74 56" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M70.5 53.5 L76 54.5 L73.5 60" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
