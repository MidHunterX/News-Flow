<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="News Flow banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B0620" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient glow + decorative grid of dots -->
  <circle cx="960" cy="70" r="190" fill="url(#glowGrad)"/>
  <g fill="#818CF8" opacity="0.18">
    <circle cx="60" cy="60" r="2.5"/><circle cx="100" cy="60" r="2.5"/><circle cx="140" cy="60" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/><circle cx="100" cy="100" r="2.5"/><circle cx="140" cy="100" r="2.5"/>
    <circle cx="60" cy="140" r="2.5"/><circle cx="100" cy="140" r="2.5"/><circle cx="140" cy="140" r="2.5"/>
  </g>
  <g fill="#C084FC" opacity="0.22">
    <circle cx="1060" cy="230" r="2.5"/><circle cx="1100" cy="230" r="2.5"/><circle cx="1140" cy="230" r="2.5"/>
    <circle cx="1060" cy="270" r="2.5"/><circle cx="1100" cy="270" r="2.5"/><circle cx="1140" cy="270" r="2.5"/>
  </g>

  <!-- Flowing wave lines (the "flow") -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20 268 C 180 232, 340 292, 540 256 S 900 210, 1220 252" stroke="#6366F1" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M-20 288 C 200 254, 380 306, 580 274 S 920 234, 1220 270" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M-20 306 C 220 276, 420 318, 620 290 S 940 258, 1220 288" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <!-- Logo mark: stacked cards + flow arrow -->
  <g transform="translate(72, 84) scale(1.6)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#4F46E5"/>
    <rect x="0" y="0" width="92" height="92" rx="22" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="40" y="16" width="34" height="46" rx="5" fill="#C7D2FE" opacity="0.55"/>
    <rect x="34" y="20" width="34" height="46" rx="5" fill="#A5B4FC" opacity="0.8"/>
    <rect x="26" y="24" width="34" height="46" rx="5" fill="#ffffff"/>
    <rect x="31" y="30" width="18" height="4" rx="2" fill="#4F46E5"/>
    <rect x="31" y="39" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <rect x="31" y="45" width="20" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <rect x="31" y="51" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <path d="M48 60 C 58 68, 68 64, 76 54" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M72.5 51.5 L78 52.5 L75.5 58" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="248" y="150" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">News</text>
  <text x="404" y="150" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="72" font-weight="800" fill="url(#accentGrad)" letter-spacing="-1.5">Flow</text>

  <!-- Tagline -->
  <text x="250" y="186" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" font-weight="500" fill="#A5B4FC" letter-spacing="4.5">AGGREGATE · REVIEW · PUBLISH</text>

  <!-- Accent divider under tagline -->
  <rect x="250" y="202" width="150" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
