<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="News Flow footer">
  <defs>
    <linearGradient id="ftrBg" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="ftrAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ftrGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="20" fill="url(#ftrBg)"/>

  <!-- Ambient glow top-right -->
  <circle cx="1010" cy="-40" r="150" fill="url(#ftrGlow)"/>

  <!-- Flowing wave lines (mirroring the banner) -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20 40 C 180 12, 360 62, 560 34 S 920 4, 1220 40" stroke="#6366F1" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M-20 60 C 200 30, 400 78, 600 50 S 940 20, 1220 56" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M-20 80 C 220 50, 440 94, 640 64 S 960 36, 1220 72" stroke="#A78BFA" stroke-opacity="0.2" stroke-width="3"/>
  </g>

  <!-- Logo mark (small) -->
  <g transform="translate(64, 38) scale(0.7)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#4F46E5"/>
    <rect x="0" y="0" width="92" height="92" rx="22" fill="url(#ftrAccent)" opacity="0.9"/>
    <rect x="40" y="16" width="34" height="46" rx="5" fill="#C7D2FE" opacity="0.55"/>
    <rect x="34" y="20" width="34" height="46" rx="5" fill="#A5B4FC" opacity="0.8"/>
    <rect x="26" y="24" width="34" height="46" rx="5" fill="#ffffff"/>
    <rect x="31" y="30" width="18" height="4" rx="2" fill="#4F46E5"/>
    <rect x="31" y="39" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <rect x="31" y="45" width="20" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <rect x="31" y="51" width="24" height="2.5" rx="1.25" fill="#A5B4FC"/>
    <path d="M48 60 C 58 68, 68 64, 76 54" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M72.5 51.5 L78 52.5 L75.5 58" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="140" y="88" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">News Flow</text>

  <!-- Divider -->
  <rect x="316" y="64" width="2" height="28" fill="#6366F1" opacity="0.6"/>

  <!-- Tagline -->
  <text x="336" y="86" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="500" fill="#A5B4FC" letter-spacing="3">AGGREGATE · REVIEW · PUBLISH</text>

  <!-- Right side: badge -->
  <text x="1136" y="86" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="600" fill="#C4B5FD" letter-spacing="1.5">SELF-HOSTED · MIT LICENSE</text>

  <!-- Bottom accent line -->
  <rect x="64" y="106" width="1072" height="3" rx="1.5" fill="url(#ftrAccent)" opacity="0.55"/>
</svg>
