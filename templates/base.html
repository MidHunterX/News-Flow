<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Flow - Realtime Aggregator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <a href="/" class="text-2xl font-black tracking-tight text-indigo-600">NewsFlow</a>
          <span class="text-xs uppercase tracking-wider bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-semibold"
            >Live</span
          >
        </div>

        <!-- Timer Visual Indicator -->
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200 text-sm">
            <svg
              class="w-4 h-4 text-indigo-600 animate-spin-slow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            <span class="text-gray-600 font-medium">Next update in:</span>
            <span id="timer-display" class="font-bold text-indigo-600 w-12">--:--</span>
          </div>
          <button
            onclick="refreshNews()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm"
          >
            Refresh Now
          </button>
          <button
            onclick="openNotifications()"
            class="relative p-2 rounded-lg border border-gray-200 bg-white text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition"
            title="Notifications"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
              </path>
            </svg>
            <span id="notif-badge"
                  class="hidden absolute -top-1 -right-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold text-center leading-5">
              0
            </span>
          </button>
          <button
            onclick="openSettings()"
            class="p-2 rounded-lg border border-gray-200 bg-white text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition"
            title="Settings"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-gray-900">Settings</h3>
          <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600 transition" title="Close">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label for="completion-interval-input" class="block text-sm font-medium text-gray-700 mb-1">
              Completion interval (minutes)
            </label>
            <p class="text-xs text-gray-500 mb-2">
              Accepted articles are marked completed one by one, each this long after being accepted.
            </p>
            <input
              id="completion-interval-input"
              type="number"
              min="1"
              step="1"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button
              onclick="closeSettings()"
              class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition"
            >
              Cancel
            </button>
            <button
              onclick="saveSettings()"
              class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notifications-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-bold text-gray-900">Notifications</h3>
          <div class="flex items-center gap-1">
            <button onclick="clearNotifications()"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium text-gray-500 hover:text-red-600 hover:bg-red-50 transition">
              Clear all
            </button>
            <button onclick="closeNotifications()" class="p-2 text-gray-400 hover:text-gray-600 transition" title="Close">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="notifications-list" class="overflow-y-auto divide-y divide-gray-100">
          <p class="px-6 py-8 text-sm text-gray-400 text-center">Loading…</p>
        </div>
      </div>
    </div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">{% block content %}{% endblock %}</main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
      News Flow Scraper &bull; Built with FastAPI & Tailwind CSS
    </footer>

    {% block scripts %}{% endblock %}

    <script>
      // Auto-refresh every 15 minutes (900 seconds)
      const autoRefreshSeconds = 15 * 60;
      let refreshing = false;
      const timerDisplay = document.getElementById("timer-display");

      // Re-scrape via the refresh endpoint, then reload to show fresh data.
      async function refreshNews() {
        if (refreshing) return;
        refreshing = true;
        const source = new URLSearchParams(window.location.search).get("source");
        const url = source ? `/api/refresh?source=${encodeURIComponent(source)}` : "/api/refresh";
        try {
          await fetch(url, { method: "POST" });
        } finally {
          window.location.reload();
        }
      }

      function updateTimer() {
        // Calculate seconds until next 15-minute interval based on system time
        const now = new Date();
        const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const secondsUntilNextInterval = autoRefreshSeconds - (secondsSinceMidnight % autoRefreshSeconds);

        // If we're exactly at an interval boundary, trigger refresh
        if (secondsUntilNextInterval === autoRefreshSeconds) {
          refreshNews();
          return;
        }

        const minutes = Math.floor(secondsUntilNextInterval / 60);
        const seconds = secondsUntilNextInterval % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
      }

      // Initial update
      updateTimer();

      // Update every second
      setInterval(updateTimer, 1000);

      // ---- Settings modal ----
      async function openSettings() {
        try {
          const res = await fetch("/api/settings");
          const settings = await res.json();
          const seconds = parseInt(settings.completion_interval, 10) || 600;
          document.getElementById("completion-interval-input").value = Math.max(1, Math.round(seconds / 60));
        } catch (err) {
          document.getElementById("completion-interval-input").value = 10;
        }
        document.getElementById("settings-modal").classList.remove("hidden");
      }

      function closeSettings() {
        document.getElementById("settings-modal").classList.add("hidden");
      }

      async function saveSettings() {
        const minutes = parseInt(document.getElementById("completion-interval-input").value, 10);
        if (!minutes || minutes < 1) {
          alert("Completion interval must be at least 1 minute.");
          return;
        }
        try {
          await fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completion_interval: String(minutes * 60) }),
          });
        } catch (err) {
          alert("Failed to save settings.");
          return;
        }
        window.location.reload();
      }

      // ---- Notifications ----
      const LEVEL_STYLES = {
        error:   { dot: "bg-red-500",   text: "text-red-600",   label: "Error" },
        warning: { dot: "bg-amber-500", text: "text-amber-600", label: "Warning" },
        info:    { dot: "bg-indigo-500", text: "text-indigo-600", label: "Info" },
      };

      function notificationRow(n) {
        const style = LEVEL_STYLES[n.level] || LEVEL_STYLES.info;
        const when = n.created_at ? n.created_at.replace("T", " ") : "";
        const link = n.article_id
          ? `<a href="/article/${n.article_id}" class="ml-1 ${style.text} hover:underline">view article</a>`
          : "";
        return `
          <div class="px-6 py-3 flex items-start gap-3">
            <span class="mt-1.5 w-2 h-2 rounded-full shrink-0 ${style.dot}"></span>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold uppercase ${style.text}">${style.label}</span>
                <span class="text-xs font-semibold text-gray-400">${n.source}</span>
                <span class="text-xs text-gray-300">${when}</span>
              </div>
              <p class="text-sm text-gray-700 break-words">${n.message}${link}</p>
            </div>
          </div>`;
      }

      function setNotifBadge(count) {
        const badge = document.getElementById("notif-badge");
        if (!badge) return;
        if (count > 0) {
          badge.textContent = count > 99 ? "99+" : String(count);
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      }

      function renderNotifications(items) {
        const list = document.getElementById("notifications-list");
        if (!items.length) {
          list.innerHTML =
            '<p class="px-6 py-8 text-sm text-gray-400 text-center">No notifications.</p>';
          return;
        }
        list.innerHTML = items.map(notificationRow).join("");
      }

      async function fetchNotificationCount() {
        try {
          const res = await fetch("/api/notifications?limit=100");
          if (!res.ok) return;
          const data = await res.json();
          setNotifBadge(data.count || 0);
        } catch (err) {
          /* badge stays hidden when the API is unreachable */
        }
      }

      async function openNotifications() {
        document.getElementById("notifications-modal").classList.remove("hidden");
        setNotifBadge(0);
        try {
          const res = await fetch("/api/notifications?limit=100");
          const data = await res.json();
          renderNotifications(data.items || []);
        } catch (err) {
          document.getElementById("notifications-list").innerHTML =
            '<p class="px-6 py-8 text-sm text-red-500 text-center">Failed to load notifications.</p>';
        }
      }

      function closeNotifications() {
        document.getElementById("notifications-modal").classList.add("hidden");
      }

      async function clearNotifications() {
        try {
          await fetch("/api/notifications", { method: "DELETE" });
        } catch (err) {
          /* fall through and re-render from the list endpoint */
        }
        setNotifBadge(0);
        renderNotifications([]);
      }

      fetchNotificationCount();
    </script>
  </body>
</html>
